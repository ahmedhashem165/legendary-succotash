<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Movie Watchlist</title>
    <link rel="stylesheet" href="/src/style.css">

    <!-- React, ReactDOM, and Babel (like the lecture screenshot) -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // Layout helpers (positions only, no changes to style.css)
        const fieldStyle = { display: "flex", flexDirection: "column", gap: "6px" };
        const rowStyle = { display: "flex", gap: "16px", flexWrap: "wrap", alignItems: "flex-end" };

        function App() {
            const [movies, setMovies] = useState([]);
            const [title, setTitle] = useState("");
            const [review, setReview] = useState("");
            const [rating, setRating] = useState("3");

            function addMovie() {
                if (title.trim() === "") {
                    return;
                }

                const newMovie = {
                    title: title,
                    review: review,
                    rating: rating
                };

                setMovies([...movies, newMovie]);

                setTitle("");
                setReview("");
                setRating("3");
            }

            function removeMovie(indexToRemove) {
                setMovies(movies.filter((movie, index) => index !== indexToRemove));
            }

            return (
                <main
                    className="container"
                    style={{ display: "flex", flexDirection: "column", gap: "24px", maxWidth: "720px", margin: "0 auto" }}
                >
                    <header className="page-header" style={{ textAlign: "center" }}>
                        <span className="eyebrow">MY PERSONAL COLLECTION</span>
                        <h1>🎬 Movie Watchlist</h1>
                        <p>Save the movies you have watched, rate them, and leave a review.</p>
                    </header>

                    <section
                        className="panel"
                        style={{ display: "flex", flexDirection: "column", gap: "16px" }}
                    >
                        <h2 style={{ margin: 0 }}>Add a movie</h2>

                        {/* Title and rating sit side by side */}
                        <div style={rowStyle}>
                            <div style={{ ...fieldStyle, flex: "1 1 260px" }}>
                                <label htmlFor="movie-title">Movie title</label>
                                <input
                                    id="movie-title"
                                    type="text"
                                    placeholder="e.g. Interstellar"
                                    value={title}
                                    onChange={(event) => setTitle(event.target.value)}
                                />
                            </div>

                            <div style={{ ...fieldStyle, flex: "0 0 140px" }}>
                                <label htmlFor="movie-rating">Your rating</label>
                                <select
                                    id="movie-rating"
                                    value={rating}
                                    onChange={(event) => setRating(event.target.value)}
                                >
                                    <option value="1">1 star</option>
                                    <option value="2">2 stars</option>
                                    <option value="3">3 stars</option>
                                    <option value="4">4 stars</option>
                                    <option value="5">5 stars</option>
                                </select>
                            </div>
                        </div>

                        <div style={fieldStyle}>
                            <label htmlFor="movie-review">Your review</label>
                            <textarea
                                id="movie-review"
                                placeholder="What did you think of the movie?"
                                rows="3"
                                value={review}
                                onChange={(event) => setReview(event.target.value)}
                            ></textarea>
                        </div>

                        {/* Button aligned to the right under the form */}
                        <div style={{ display: "flex", justifyContent: "flex-end" }}>
                            <button className="add-button" onClick={addMovie}>
                                + Add movie
                            </button>
                        </div>
                    </section>

                    <section
                        className="watchlist-section"
                        style={{ display: "flex", flexDirection: "column", gap: "16px" }}
                    >
                        <div
                            className="list-heading"
                            style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}
                        >
                            <h2 style={{ margin: 0 }}>Watched movies</h2>
                            <span className="count">{movies.length} movies</span>
                        </div>

                        {movies.length === 0 ? (
                            <div
                                className="empty-state"
                                style={{ display: "flex", flexDirection: "column", alignItems: "center", textAlign: "center", gap: "6px" }}
                            >
                                <div className="empty-icon">🍿</div>
                                <p style={{ margin: 0 }}>No movies added yet.</p>
                                <span>Your watched movies will appear here.</span>
                            </div>
                        ) : (
                            <div
                                className="movie-list"
                                style={{ display: "flex", flexDirection: "column", gap: "12px" }}
                            >
                                {movies.map((movie, index) => (
                                    <div
                                        className="movie-card"
                                        key={index}
                                        style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: "16px" }}
                                    >
                                        <div className="movie-info" style={{ flex: 1, minWidth: 0 }}>
                                            <h3 style={{ margin: "0 0 4px" }}>{movie.title}</h3>
                                            <div className="stars">{"⭐".repeat(Number(movie.rating))}</div>
                                            <p style={{ margin: "6px 0 0" }}>{movie.review || "No review added."}</p>
                                        </div>
                                        <button
                                            className="remove-button"
                                            onClick={() => removeMovie(index)}
                                            style={{ flexShrink: 0 }}
                                        >
                                            Remove
                                        </button>
                                    </div>
                                ))}
                            </div>
                        )}
                    </section>
                </main>
            );
        }

        // Put the App component inside <div id="root">.
        ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
</body>
</html>
