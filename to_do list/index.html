<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Todo App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <h1>Todo App</h1>

    <form id="todo-form" class="add-row" autocomplete="off">
      <input id="todo-input" type="text" placeholder="What needs doing?" aria-label="New todo" />
      <button type="submit" class="btn-add">Add</button>
    </form>

    <div class="toolbar">
      <p class="tip">Tip: double-click a todo to edit. Press Enter to save.</p>
      <div class="filters" role="group" aria-label="Filter todos">
        <button class="filter active" data-filter="all">All</button>
        <button class="filter" data-filter="active">Active</button>
        <button class="filter" data-filter="completed">Completed</button>
      </div>
    </div>

    <ul id="todo-list" class="todo-list"></ul>

    <footer class="footer">
      <span id="count">0 items left</span>
      <div class="footer-actions">
        <button id="clear-completed" class="btn-small">Clear completed</button>
        <button id="clear-all" class="btn-small">Clear all</button>
      </div>
    </footer>
  </main>

  <!-- Compile first: tsc app.ts --target ES2017 -->
  <script src="app1.js"></script>
</body>
</html>
